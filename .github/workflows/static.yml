name: Deploy static content to Pages

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        run: |
          rm -rf site
          mkdir -p site

          # src pasa a ser la raíz del sitio
          cp -r src/. site/

          # public se conserva como /public
          mkdir -p site/public
          cp -r public/. site/public/

          # Adaptar referencias que originalmente eran
          # src -> ../public
          find site -type f \( -name "*.html" -o -name "*.css" -o -name "*.js" \) \
            -exec sed -i 's#\.\./public/#./public/#g' {} +

          # Evitar procesamiento de Jekyll
          touch site/.nojekyll

      - name: Verify site contents
        run: |
          echo "===== FILES THAT WILL BE DEPLOYED ====="
          find site -type f | sort

          echo ""
          echo "===== CHECKING INDEX ====="
          test -f site/index.html && echo "index.html OK" || exit 1

          echo ""
          echo "===== PUBLIC FILES ====="
          find site/public -type f | sort

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
